<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>カタン 挑戦者AI 対局</title>
<link rel="stylesheet" href="css/styles.css?v=20260829f">
</head>
<body data-mode="pc" data-lang="ja">

<!-- ===== 上部バー ===== -->
<div class="topbar">
  <div class="brand">
    <h1><span data-i18n="brand_title">カタン 挑戦者AI 対局</span></h1>
    <span class="sub" data-i18n="brand_sub">あなた 対 AI3人</span>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <div class="grp">
      <button id="pauseBtn" class="btn icbtn">⏸</button>
      <label data-i18n="speed_label">AI速度</label>
      <input id="speedRange" type="range" min="0" max="3" step="0.5" value="1">
      <span id="speedLabel" class="speedval">1.0秒</span>
    </div>
    <button id="evalBtn" class="btn">AI評価値: OFF</button>
    <button id="winMeterBtn" class="btn">勝率ゲージ: OFF</button>
    <div class="menuwrap">
      <button id="menuBtn" class="btn icbtn menubtn" aria-haspopup="true" aria-expanded="false" title="メニュー">⋯</button>
      <div class="menu" id="topMenu">
        <button id="replayBtn" class="btn" disabled data-i18n="replay_btn">棋譜確認</button>
        <button id="exportBtn" class="btn" disabled data-i18n="export_btn">棋譜書き出し</button>
        <button id="loadBtn" class="btn" data-i18n="load_btn">棋譜読込</button>
        <button id="composerBtn" class="btn" data-i18n="composer_btn">手動で配置を作る</button>
        <button id="newBtn" class="btn ghost" data-i18n="new_btn">新規対局</button>
        <button id="modeBtn" class="btn ghost">PC表示</button>
        <button id="placementModeBtn" class="btn ghost">配置操作: ワンタッチ</button>
        <button id="langBtn" class="btn ghost">English</button>
        <button id="tuneBtn" class="btn ghost" data-i18n="tune_btn">⚙ AI調整</button>
      </div>
    </div>
  </div>
</div>

<div id="winMeter" aria-live="polite">
  <div class="wmhead"><b>AI推定勝率</b><span id="winMeterMeta">30特徴学習モデル＋終局シミュレーション</span></div>
  <div id="winMeterBar"></div>
  <div id="winMeterLabels"></div>
</div>

<!-- ===== 本体（PCは2カラム / スマホは縦3段グリッド） ===== -->
<div class="appmain">

  <!-- 盤面 -->
  <div id="boardRegion">
    <div class="boardwrap">
      <button id="boardFocusBtn" class="boardfocus" type="button" aria-label="盤面を全画面表示" title="盤面を全画面表示">⛶</button>
      <svg id="board" viewBox="0 0 560 560" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div id="replayBar">
      <div class="rvtop">
        <b id="rvTitle">リプレイ</b>
        <span id="rvCount">0 / 0</span>
        <div class="spacer"></div>
        <button id="rvPrev" class="btn sm">◀ 前</button>
        <button id="rvPlay" class="btn sm">▶ 自動</button>
        <button id="rvNext" class="btn sm">次 ▶</button>
        <button id="rvExit" class="btn sm ghost">閉じる</button>
      </div>
      <div id="rvHands"></div>
      <div id="rvEvents"></div>
      <div id="rvNotes">
        <label class="rvnl" for="rvTurnNote">このターンへのコメント</label>
        <textarea id="rvTurnNote" rows="2" placeholder="この手について気づいたことを書く（棋譜に保存されます）"></textarea>
        <label class="rvnl" for="rvGameNote">この対局全体へのコメント</label>
        <textarea id="rvGameNote" rows="2" placeholder="対局全体の総評（棋譜に保存されます）"></textarea>
      </div>
    </div>
    <div id="composerBar">
      <div class="rvtop">
        <b data-i18n="cp_title">盤面＆配置エディタ</b>
        <div class="spacer"></div>
        <button id="cpBlank" class="btn sm">空盤面</button>
        <button id="cpShuffle" class="btn sm">ランダム盤面</button>
        <button id="cpExport" class="btn sm" data-i18n="cp_export">棋譜書き出し</button>
        <button id="cpExit" class="btn sm ghost" data-i18n="cp_exit">終了</button>
      </div>
      <div class="cpsec">
        <div id="selHex" class="hint">タイルをクリック → 資源と数字を指定（同じボタンで解除）</div>
        <div id="resPicker" class="pickrow"></div>
        <div id="numPicker" class="pickrow"></div>
        <div id="tileTally" class="hint"></div>
      </div>
      <div class="cpsec">
        <div class="hint">港: 種類を選んで海岸線の辺をクリック（もう一度で削除）</div>
        <div id="portPicker" class="pickrow"></div>
      </div>
      <div class="cpsec">
        <div class="hint">配置(任意): プレイヤーを選んで 頂点=開拓地 / 辺=道</div>
        <span class="cpseg">
          <button class="segb cpp on" data-cp="1">P1</button>
          <button class="segb cpp" data-cp="2">P2</button>
          <button class="segb cpp" data-cp="3">P3</button>
          <button class="segb cpp" data-cp="4">P4</button>
        </span>
        <div id="cpStat"></div>
      </div>
    </div>
  </div>

  <!-- 情報パネル（PC=右カラム縦積み / スマホ=タブ切替） -->
  <div id="panelRegion">
    <div class="tabbar" id="tabBar">
      <button class="tabbtn on" data-tab="status" data-i18n="tab_status">状況</button>
      <button class="tabbtn" data-tab="eval" data-i18n="tab_eval">AI評価値</button>
      <button class="tabbtn" data-tab="log" data-i18n="tab_log">ログ</button>
      <button class="tabbtn" data-tab="bank" data-i18n="tab_bank">銀行</button>
      <button class="tabbtn" data-tab="opp" data-i18n="tab_opp">相手</button>
    </div>

    <div class="tabpanel tp-status active" data-tab="status">
      <div class="statusbar" id="statusBar"></div>
    </div>

    <div class="tabpanel tp-eval" data-tab="eval">
      <div id="evalPanel">
        <h3 id="evalTitle" data-i18n="eval_title">AI評価値</h3>
        <div class="plan" id="evalPlan"></div>
        <div id="evalList"></div>
      </div>
    </div>

    <div class="tabpanel tp-log grow" data-tab="log">
      <div class="panel logpanel">
        <h2><span data-i18n="log_title">ログ</span></h2>
        <div id="gameLog"></div>
      </div>
    </div>

    <div class="tabpanel tp-bank" data-tab="bank">
      <div class="panel">
        <h2><span data-i18n="bank_title">銀行</span> <span class="mini" data-i18n="bank_left">残りカード</span></h2>
        <div class="bankgrid" id="bankGrid"></div>
        <div class="bankmeta" id="bankMeta"></div>
        <div class="devplayed" id="devPlayed"></div>
      </div>
    </div>

    <div class="tabpanel tp-opp" data-tab="opp">
      <div class="panel">
        <h2><span data-i18n="opp_title">相手プレイヤー</span> <span class="mini" data-i18n="opp_sub">手札は枚数のみ公開</span></h2>
        <div id="oppPanel"></div>
      </div>
    </div>
  </div>

  <!-- 自分の手札 + 操作（常に下に固定） -->
  <div id="handRegion">
    <div class="handbar">
      <div class="handhead">
        <span class="ht" data-i18n="hand_title">あなたの手札</span>
        <span id="meStat"></span>
        <button id="noteToggle" class="btn sm ghost notetoggle" type="button">✎ コメント</button>
      </div>
      <div class="cards" id="myCards"></div>
      <div class="devcards" id="myDev"></div>
      <div class="actions" id="actions">
        <button id="rollBtnU" class="btn primary" disabled data-i18n="act_roll">🎲 サイコロを振る</button>
        <button id="buyDevU" class="btn" disabled data-i18n="act_buydev">発展カードを買う</button>
        <button id="knightU" class="btn" disabled data-i18n="act_knight">騎士</button>
        <button id="roadsU" class="btn" disabled data-i18n="act_roads">街道建設</button>
        <button id="plentyU" class="btn" disabled data-i18n="act_plenty">収穫</button>
        <button id="monoU" class="btn" disabled data-i18n="act_mono">独占</button>
        <div class="trade">
          <select id="tradeGive"></select><span class="arw">→</span><select id="tradeGet"></select>
          <button id="tradeBtnU" class="btn sm" disabled data-i18n="act_trade">交易</button>
        </div>
        <button id="endTurnU" class="btn good" disabled data-i18n="act_endturn">ターン終了</button>
      </div>
      <div id="liveNoteBox">
        <div class="liveNoteHead">
          <label for="liveTurnNote">棋譜コメント</label>
          <span id="liveNoteTarget">現在のターンに保存</span>
        </div>
        <textarea id="liveTurnNote" rows="2" placeholder="このターンの判断や気づきを入力（ターン終了時に棋譜へ自動保存）"></textarea>
        <div id="liveNoteStatus">未入力</div>
      </div>
      <div class="prompt" id="prompt" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ===== 開始画面（全画面オーバーレイ） ===== -->
<div id="startScreen">
  <div class="startcard">
    <div id="startTop"></div>
    <h2 data-i18n="setup_title">対局の設定</h2>
    <div class="lead" data-i18n-html="setup_lead"></div>
    <div class="sublabel" data-i18n="your_seat">あなたの席</div>
    <div class="seatpick" id="seatPick"></div>
    <div class="seatgrid" id="seatGrid"></div>
    <div class="startrow">
      <button id="shuffleBtn" class="btn" data-i18n="shuffle_btn">盤面シャッフル</button>
      <button id="startLoadBtn" class="btn" data-i18n="load_btn">棋譜読込</button>
      <button id="startComposerBtn" class="btn" data-i18n="composer_btn">手動で配置を作る</button>
      <div class="spacer"></div>
      <button id="startBtn" class="btn primary" data-i18n="start_btn">対局開始</button>
    </div>
  </div>
</div>
<input type="file" id="loadInput" accept="application/json,.json" style="display:none">


<!-- ===== エンジンが参照する非表示スタブ ===== -->
<div style="display:none" aria-hidden="true">
  <span id="bestToggle"></span><span id="bestHint"></span>
  <input id="gamePlayers" value="4"><div id="gameStart"></div><div id="gameBox"></div>
</div>

<!-- ===== AIチューニング ドロワー ===== -->
<div id="tuneBackdrop" class="tune-backdrop"></div>
<aside id="tunePanel" class="tunepanel" aria-hidden="true"></aside>

<div id="toast" class="toast"></div>

<script src="js/engine.js?v=20260829f"></script>
<script src="js/app.js?v=20260829f"></script>
<script src="js/multiplayer.js?v=20260829f"></script>
</body>
</html>
